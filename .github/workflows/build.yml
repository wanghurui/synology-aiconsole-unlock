name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: vet + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: go vet
        run: go vet ./...

      - name: cross-compile
        run: |
          set -eu
          mkdir -p build
          for t in linux/amd64 linux/arm64 linux/arm; do
            os=${t%%/*}
            arch=${t##*/}
            name="$arch"
            if [ "$arch" = arm ]; then name="armv7"; GOARM=7; else GOARM=; fi
            out="build/aiconsole-unlock-linux-$name"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" ${GOARM:+GOARM=$GOARM} \
              go build -trimpath -ldflags "-s -w" -o "$out" .
          done

      - name: checksums
        run: cd build && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: aiconsole-unlock
          path: build/*

  release:
    name: attach to release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aiconsole-unlock
          path: build

      - uses: softprops/action-gh-release@v2
        with:
          files: build/*
          generate_release_notes: true
