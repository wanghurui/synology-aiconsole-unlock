name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: vet + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: cross-compile
        run: |
          set -eu
          mkdir -p build
          build() {
            os=$1; arch=$2; suffix=$3; goarm=$4
            out="build/aiconsole-unlock-linux-$suffix"
            echo "building $out"
            if [ -n "$goarm" ]; then
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM="$goarm" \
                go build -trimpath -ldflags "-s -w" -o "$out" .
            else
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags "-s -w" -o "$out" .
            fi
          }
          build linux amd64 amd64 ''
          build linux arm64 arm64 ''
          build linux arm   armv7 7
          ls -l build

      - name: checksums
        run: cd build && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: aiconsole-unlock
          path: build/*

  release:
    name: attach to release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aiconsole-unlock
          path: build

      - uses: softprops/action-gh-release@v2
        with:
          files: build/*
          generate_release_notes: true
